# PRs: Lint + Typecheck. Push auf main: dieselben Checks, dann Image bauen,
# nach GHCR pushen (Tags: sha-<commit> und latest) und Dokploy deployen.
# Einrichtung (Secrets, Dokploy): README, „Deployment“.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PRs: alter Lauf weg; main: Deploys laufen nacheinander, keiner wird abgebrochen
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check

  image:
    name: Image bauen
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          # einziger Wert, den der Build liest (Server-Island-Props)
          secrets: astro_key=${{ secrets.ASTRO_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Dokploy)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Dokploy zieht `latest` neu und tauscht den Container per Rolling Update
      # (docker-compose.yml). Ohne Secrets wird nur gebaut, nicht deployt.
      - name: Dokploy-Deploy auslösen
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::warning::DOKPLOY_URL, DOKPLOY_API_KEY oder DOKPLOY_COMPOSE_ID fehlt, kein Deploy"
            exit 0
          fi
          curl -sS --fail-with-body -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
